<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo equipo</title>
    <link rel="stylesheet" th:href="@{/css/team.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('teams')}"></div>

<div class="container form-page">
    <h2>Nuevo equipo</h2>

    <div class="error-box" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/teams}" method="post" class="modal-form">
        <label>Club
            <input type="text" name="name" placeholder="Nombre del club" required maxlength="255" th:value="${name}">
        </label>
        <label>Competición y grupo
            <input type="text" name="competitionGroup" placeholder="Quarta Catalana - Grup 34" required maxlength="255" th:value="${competitionGroup}">
        </label>

        <div class="modal-actions">
            <a th:href="@{/teams}" class="btn-cancel">Cancelar</a>
            <button type="submit" class="btn-submit">Guardar</button>
        </div>
    </form>
</div>

</body>
</html>
